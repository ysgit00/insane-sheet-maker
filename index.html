<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>인세인 캐릭터 시트 · SF Sheet Maker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
  :root { --fg: #171717; --sub: #737373; --mute: #a3a3a3; --line: #e5e5e5; --bg: #f5f5f4 }
  * { box-sizing: border-box }
  body { margin: 0; display: flex; height: 100vh; overflow: hidden; color: var(--fg); background: var(--bg);
    font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif }
  #side { width: 480px; flex: none; overflow-y: auto; background: #fff; border-right: 1px solid var(--line) }
  #view { flex: 1; overflow: auto; padding: 32px; display: flex; align-items: flex-start; justify-content: center }
  #c { width: 100%; max-width: 1400px; height: auto; background: #fff; box-shadow: 0 2px 12px #00000014 }

  .bar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--fg) }
  .bar #reset { margin-left: auto; color: var(--sub) }
  form { padding: 0 24px 48px }
  section { display: grid; gap: 10px; padding: 22px 0; border-bottom: 1px solid var(--line) }
  section:last-child { border: 0 }
  h2 { margin: 0 0 4px; font: 700 16px/1.3 "Nanum Myeongjo", serif }
  h2.head { display: flex; justify-content: space-between; align-items: baseline }
  h2 .sub { font-family: system-ui, sans-serif; font-weight: 400; font-size: 13px; color: var(--sub) }
  h2 .sub button, h2 .sub .btn { height: auto }

  input, select, textarea, button, .btn { font: inherit; color: inherit }
  input:not([type=checkbox], [type=radio]), select, textarea { width: 100%; min-width: 0; height: 32px; padding: 0 2px;
    background: transparent; border: 0; border-bottom: 1px solid #d4d4d4; border-radius: 0 }
  textarea { height: auto; padding: 6px 8px; border: 1px solid #d4d4d4; resize: vertical }
  input::placeholder, textarea::placeholder { color: var(--mute) }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--fg) }
  input[type=checkbox] { accent-color: var(--fg); margin: 0 }

  button, .btn { display: inline-flex; align-items: center; height: 30px; padding: 0; cursor: pointer; white-space: nowrap;
    background: none; border: 0; text-decoration: underline; text-decoration-color: #d4d4d4; text-underline-offset: 4px }
  button:hover, .btn:hover { text-decoration-color: currentColor }
  #print { padding: 0 14px; background: var(--fg); color: #fff; text-decoration: none; border-radius: 2px }
  #print:hover { background: #404040 }

  label { display: flex; gap: 6px; align-items: center }
  .f { display: grid; grid-template-columns: 88px 1fr; gap: 8px }
  .f > span { color: var(--sub) }
  .f:has(textarea) { align-items: start }
  .f:has(textarea) > span { padding-top: 6px }
  .row { display: flex; gap: 14px; align-items: center }
  .hint { margin-left: auto; color: var(--mute); font-size: 13px }

  .chip { position: relative; gap: 0; color: var(--sub); cursor: pointer; white-space: nowrap; user-select: none }
  .chip:hover { color: var(--fg) }
  .chip input { position: absolute; inset: 0; opacity: 0; pointer-events: none }
  .chip::before { content: "○"; margin-right: 3px; font-size: .8em }
  .chip:has(:checked) { color: var(--fg); font-weight: 700 }
  .chip:has(:checked)::before { content: "●" }
  .chip:has(:focus-visible) { outline: 1px solid var(--fg) }
  .gauge { display: flex; justify-content: space-between; font-family: "Nanum Myeongjo", serif; font-size: 15px }
  .gauge .chip { justify-content: center; width: 26px; height: 26px; border-radius: 50% }
  .gauge .chip::before { content: none }
  .gauge .chip:has(:checked) { color: #fff; background: var(--fg) }
  .stepper { display: flex; align-items: center }
  .stepper input { width: 44px; border: 0; text-align: center; font-size: 16px; -moz-appearance: textfield }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0 }
  .stepper button { flex: none; justify-content: center; width: 30px; height: 30px; font-size: 18px; text-decoration: none;
    border: 1px solid #d4d4d4; border-radius: 2px }
  .stepper button:hover { border-color: var(--fg) }
  .worlds { display: flex; flex-wrap: wrap; gap: 4px 18px }

  .skills { width: 100%; margin-top: 8px; border-collapse: collapse; table-layout: fixed; font-size: 13px }
  .skills th { padding-bottom: 6px; font: 700 14px "Nanum Myeongjo", serif; border-bottom: 1px solid var(--fg) }
  .skills td { padding: 3px 0 }
  .skills .chip { justify-content: center; color: #525252 }
  .skills .chip::before { content: none }
  .skills .chip:has(:checked) { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px }

  .ab { position: relative; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 0 10px 24px; border-bottom: 1px dotted #d4d4d4 }
  .ab:last-child { border: 0 }
  .ab > * { flex: 1 1 40% }
  .ab::before { content: attr(data-n); position: absolute; left: 2px; top: 11px; font: 700 14px "Nanum Myeongjo", serif; color: var(--sub) }
  .ab textarea { flex-basis: 100% }
  .person { gap: 10px }
  .person > input { flex: 2 1 0 }
  .person > .emo { flex: 1 1 0 }
  .person > select { flex: none; width: 44px }
  [hidden] { display: none !important }

  @media screen and (max-width: 900px) {
    body { flex-direction: column; height: auto; overflow: visible }
    #side { width: 100%; overflow: visible; border-right: 0 }
    .bar { position: static; padding: 12px 16px }
    form { padding: 0 16px 32px }
    #view { order: -1; position: sticky; top: 0; z-index: 2; padding: 8px; overflow: visible;
      background: var(--bg); border-bottom: 1px solid var(--line) }
    .skills { font-size: 12px }
    .gauge { font-size: 13px }
    .gauge .chip { width: 21px; height: 21px }
  }

  @page { size: A4 landscape; margin: 0 }
  @media print {
    #side { display: none }
    body, #view { display: block; height: auto; padding: 0; overflow: visible; background: #fff }
    #c { width: 100%; max-width: none; box-shadow: none }
  }
</style>
<div id="side">
  <div class="bar">
    <button id="print">PDF 저장</button>
    <button id="export">시트 저장</button>
    <label class="btn"><input id="import" type="file" hidden>시트 열기</label>
    <button id="reset">초기화</button>
  </div>
  <form id="f" onsubmit="return false"></form>
</div>
<div id="view"><canvas id="c" width="2047" height="1340"></canvas></div>
<script src="app.js"></script>
</html>
